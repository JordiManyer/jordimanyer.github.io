name: Deploy Website

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Download CV
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          workflow: make.yml
          repo: JordiManyer/curriculum

      - name: Copy files
        run: |
          cp jordi-manyer-cv.pdf/main.pdf public/jordi-manyer-cv.pdf
          rm -rf jordi-manyer-cv.pdf
          cp publications.bib/publications.bib public/publications.bib
          rm -rf publications.bib
          cp workshops.bib/workshops.bib public/workshops.bib
          rm -rf workshops.bib

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Build website
        run: npm run build

      # Only pushes to master are deployed; other branches and pull requests
      # just build.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
