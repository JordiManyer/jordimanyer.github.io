name: Deploy Website

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Download CV
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          workflow: make.yml
          repo: JordiManyer/curriculum

      - name: Copy files
        run: |
          cp jordi-manyer-cv.pdf/main.pdf static/jordi-manyer-cv.pdf
          rm -rf jordi-manyer-cv.pdf
          cp publications.bib/publications.bib static/publications.bib
          rm -rf publications.bib
          cp workshops.bib/workshops.bib static/workshops.bib
          rm -rf workshops.bib

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Check formatting, lint and types
        run: deno task check

      - name: Build website
        run: deno task build

      # Pushes to master go to production; pushes to other branches get a
      # preview URL. Pull requests only build.
      - name: Deploy to DenoDeploy
        if: github.event_name == 'push'
        run: |
          sed -i '/_fresh\//d' .gitignore
          sed -i '/static\/jordi-manyer-cv.pdf/d' .gitignore
          sed -i '/static\/publications.bib/d' .gitignore
          sed -i '/static\/workshops.bib/d' .gitignore
          # Invoke the deploy CLI directly: the `deno deploy` wrapper built into
          # Deno 2.9.x forwards every flag twice, which the CLI rejects.
          # --no-config keeps the CLI's own npm deps out of this project's
          # manual node_modules setup.
          deno run -A --no-config jsr:@deno/deploy --org=jmanyer --app=jordimanyer --non-interactive \
            ${{ github.ref == 'refs/heads/master' && '--prod' || '' }}
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}

      - name: Show recent revisions (diagnostics)
        if: failure()
        run: |
          deno run -A --no-config jsr:@deno/deploy deployments list \
            --org=jmanyer --app=jordimanyer --json --non-interactive | head -c 1500
          echo; echo "=== app config"
          deno run -A --no-config jsr:@deno/deploy apps get \
            --org=jmanyer --app=jordimanyer --json --non-interactive | head -c 3000
          echo; echo "=== recent logs"
          deno run -A --no-config jsr:@deno/deploy logs \
            --org=jmanyer --app=jordimanyer --once --json --non-interactive | tail -c 8000
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
